# Daily Google Scholar update: one SerpApi request, commit src/data/scholar.json if it changed, then
# deploy. Commits pushed with GITHUB_TOKEN don't trigger other workflows, so this calls the deploy
# workflow directly (deploy.yml is reusable via workflow_call).
name: Update Scholar citations

on:
  schedule:
    - cron: '17 10 * * *' # daily, 10:17 UTC
  workflow_dispatch:

concurrency:
  group: update-scholar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Scholar numbers
        run: node scripts/update-scholar.mjs
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- src/data/scholar.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/scholar.json
            git commit -m "Update Scholar citations"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
