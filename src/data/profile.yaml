# Hero paragraph(s). Separate paragraphs with a blank line.
intro: |
  I work on making AI systems honest about their own certainty, so that when they are confident, you can be too.
  My research develops confidence estimation methods for language models, with a focus on oncology and finance,
  where overconfidence can cause serious harm.

