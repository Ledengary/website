# Presentations on /research (after the papers), rendered by src/components/PresentationCard.astro.
# Only presentations with photos or a video are listed; newest first by date.
#
# - id: astro-2026                    # photos live in src/assets/presentations/<id>/
#   date: "2026-09"                   # "YYYY-MM-DD", "YYYY-MM", or "YYYY" when the month is unknown;
#                                     # shown as month and year. Use full dates to order two in one month.
#   event: ASTRO 2026 Annual Meeting
#   location: Boston                  # city; optional
#   title: ...                        # the presentation's title
#   type: oral                        # talk | oral | invited | rapid-fire | spotlight | poster | tutorial | guest-lecture
#   related_paper: safe-clinical-astro26   # optional publication id; the Paper button anchors to /research#<id>
#   also:                             # optional: more presentations at the same event, one line each on the card
#     - { title: ..., type: spotlight, related_paper: ... }
#   youtube: { id: Dq-Y-ybQOIs, start: 205 }   # optional; start in seconds
#   photos:                           # optional; the first is the lead photo
#     - { file: 01.jpg, caption: ..., alt: ..., position: "50% 30%" }   # position: optional crop focus in the 16:9 card
#   links: { slides: "https://...", paper: "https://..." }   # optional extra links
#
# Photo originals are local only (gitignored); see docs/inputs/presentations-review.md.

