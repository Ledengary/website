#   theme: confidence                  # confidence | oncology | earlier
#   subgroup: New estimators across model families
#   tags: [oncology]                   # core-cs | oncology | medical | finance (optional)
#   highlight: ...                     # optional, shown in petrol
#   status_note: Under review          # optional
