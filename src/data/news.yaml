# Latest News on Home, shown one year at a time (year tabs, newest first).
# Rendered by src/components/NewsCallout.astro. Add one block per item:
#
# - date: "2026-09"        # "YYYY-MM", or "YYYY" when the month is unknown (sorts last in its year)
#   category: publication  # publication | abstract | talk | honor | career | teaching | media
#                          # (abstract = posters and spotlights; talk = orals, invited talks, tutorials)
#   title: Short headline
#   body: >-
#     One or two sentences (inline Markdown works, but put links in `links`).
#   links:                 # optional; shown as buttons right after the text
#     - { label: Paper, url: "https://..." }
#
# The emoji for each category is added by the component; don't type it here.
# Items in the same month show in the order they appear in this file.
# Every link was checked before it went in; open items are in docs/LINKS_TODO.md.

# --- 2026 ---

- date: "2026-09"
  category: publication
  title: "Vision-language models that know when they're guessing"
  body: >-
    BICR was accepted to the AACL-IJCNLP 2026 main conference. It flags answers driven by language
    priors rather than the image, at zero added inference cost.
  links:
    - { label: Paper, url: "https://arxiv.org/abs/2605.10893" }
    - { label: Code, url: "https://github.com/Ledengary/BICR" }

- date: "2026-07"
  category: abstract
  title: "Spotlight at ASTRO 2026"
  body: >-
    Our work on safely automating oncology chart review with calibrated confidence was selected as a
    spotlight at the ASTRO 2026 Annual Meeting.

- date: "2026-07"
  category: teaching
  title: "Teaching students across MSU when to trust AI"
  body: >-
    My work on what an AI system's confidence can and cannot tell us is featured in MSU's new
    university-wide AI Literacy course, part of the AI-Ready Spartans initiative.
  links:
    - { label: Watch, url: "https://www.youtube.com/watch?v=7K12pQKEFw8" }
    - { label: AI-Ready Spartans, url: "https://ai.msu.edu/ai-ready" }

- date: "2026-05"
  category: talk
  title: "Three abstracts at ASTRO 2026, including an oral in the top 11%"
  body: >-
    The oral shows how risk-informed training reduces catastrophic errors when language models make
    oncology decisions. Two more abstracts cover selective automation of chart review and clinical
    validation of a privacy-preserving model for CTCAE toxicity grading.

- date: "2026-01"
  category: talk
  title: "Invited talk at JPMorgan AI Research"
  body: >-
    I presented CCPS, our method for calibrating LLM confidence, to the JPMorgan AI Research team.

- date: "2026-01"
  category: publication
  title: "How reliable are confidence estimators for reasoning models?"
  body: >-
    RMCB was accepted to the EACL 2026 main conference (20.1% acceptance rate). It covers 347K+
    reasoning traces from six reasoning models across clinical, financial, legal, and mathematical
    tasks.
  links:
    - { label: Paper, url: "https://aclanthology.org/2026.eacl-long.78/" }
    - { label: Code, url: "https://github.com/Ledengary/RMCB" }
    - { label: Data, url: "https://huggingface.co/datasets/ledengary/RMCB" }

